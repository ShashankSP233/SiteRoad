<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23262b">
<title>SiteXpense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><div class="logo">S</div><h1>SiteXpense</h1></div>
    <div class="sub">Site Expense Management — Node.js edition</div>
    <div class="field"><label>Username</label><input id="lg-user" autocomplete="username" placeholder="Enter your username"></div>
    <div class="field"><label>Password</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block" id="lg-btn">Sign in</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand"><div class="logo">S</div><h1>SiteXpense</h1></div>
      <nav class="nav" id="nav"></nav>
      <div class="who" id="who"></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="btn btn-ghost btn-sm menu-btn" id="menu-btn">☰</button>
        <div><h2 id="pageTitle">Dashboard</h2><div class="crumb" id="pageCrumb"></div></div>
        <div class="spacer"></div>
        <div id="topActions"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <nav class="botnav" id="botnav"></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
